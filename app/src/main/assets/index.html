<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f0e6"><meta name="description" content="Mindful Reader by RK: original study summaries, mantras and trading discipline tracker"><title>Mindful Reader by RK — Kindle-style Study App</title><style>:root{--bg:#f5f0e6;--page:#fffcf5;--ink:#26281e;--muted:#74766d;--hair:#e1dacd;--accent:#35675b;--accent2:#adc9b1;--glass:rgba(255,252,245,.92);--reader-size:19px;--reader-leading:1.85;--serif:Georgia,'Times New Roman',serif;color-scheme:light}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}body[data-theme=light]{--bg:#f0f1ef;--page:#fff;--ink:#242b2a;--muted:#687372;--hair:#d9e0dd;--accent:#23695b;--accent2:#cbe1d4;--glass:rgba(255,255,255,.95)}body[data-theme=dark]{--bg:#131b1b;--page:#1b2523;--ink:#f1f0e4;--muted:#a2b0aa;--hair:#33443e;--accent:#94c5aa;--accent2:#2f594d;--glass:rgba(27,37,35,.96);color-scheme:dark}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.app{max-width:1050px;margin:auto;min-height:100svh;padding-bottom:86px}.top{position:sticky;top:0;z-index:10;background:var(--glass);backdrop-filter:blur(18px);border-bottom:1px solid var(--hair);height:65px;padding:0 18px;display:flex;align-items:center;gap:10px}.mark{width:35px;height:35px;border-radius:11px;display:grid;place-items:center;background:var(--accent);color:var(--page);font-family:Georgia,serif;font-weight:bold;font-size:20px;flex-shrink:0}.brand{flex:1;min-width:0}.brand b{font-family:Georgia,serif;letter-spacing:.1px;font-size:19px}.brand small{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted t:1.6}.btn{background:var(--accent);color:var(--page);padding:12px 17px;border:0;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:43px}.btn.secondary{border:1px solid var(--hair);background:var(--page);color:var(--ink)}.btn.tiny{font-size:12px;padding:8px 12px;min-height:34px}.btn:disabled{opacity:.45;cursor:not-allowed}body[data-theme=dark] .btn:not(.secondary){color:#10211b}.card{background:var(--page);border:1px solid var(--hair);border-radius:19px;padding:19px}.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.bookcard{background:var(--page);border:1px solid var(--hair);border-radius:17px;overflow:hidden;padding:12px;text-align:left;color:var(--ink);min-width:0;display:flex;flex-direction:column}.bookcover{aspect-ratio:3/3.85;min-height:170px;max-height:280px;border-radius:10px;display:flex;flex-direction:column;justify-content:space-between;padding:16px 12px;background:var(--cover);color:#fff;position:relative;overflow:hidden;box-shadow:inset 8px 0 10px #0002,0 6px 14px #0001}.bookcover:before{content:'';position:absolute;width:220px;height:220px;border:1px solid #fff4;border-radius:50%;right:-100px;top:30px}.bookcover:after{content:'';position:absolute;width:115px;height:115px;border:1px solid #fff4;border-radius:50%;left:-70px;bottom:-50px}.cover-kicker{font-size:9px;letter-spacing:2px;font-weight:750;z-index:1}.cover-title{font:clamp(17px,3.3vw,28px)/1.09 Georgia,serif;letter-spacing:-.55px;z-index:1}.cover-author{font-size:10px;letter-spacing:1px;opacity:.85;z-index:1}.book-info{padding:10px 2px 2px;display:grid;gap:4px}.book-info strong{font-size:13px;line-height:1.35}.book-info span{font-size:11px;color:var(--muted)}.progress{height:5px;background:var(--hair);border-radius:30px;overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);border-radius:30px}.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:var(--page);border:1px solid var(--hair);border-radius:16px;padding:15px 9px;text-align:center}.metric b{font:28px Georgia,serif;display:block}.metric span{font-size:10px;color:var(--muted)}.chapter-list{display:grid;gap:8px}.chapter-row{width:100%;padding:16px 14px;text-align:left;background:var(--page);border:1px solid var(--hair);border-radius:13px;color:var(--ink);display:flex;gap:12px;align-items:center}.chapter-row span:first-child{font:20px Georgia,serif;color:var(--accent);min-width:32px}.chapter-row strong{font-size:13px;line-height:1.4}.chapter-row small{display:block;margin-top:5px;color:var(--muted);font-size:11px}.reader{max-width:760px;margin:0 auto}.reader-head{display:flex;align-items:center;gap:9px;margin:6px 0 17px}.reader-head .breadcrumb{flex:1;font-size:11px;letter-spacing:.7px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.paper{background:var(--page);border:1px solid var(--hair);border-radius:17px;padding:clamp(21px,5vw,52px);box-shadow:0 8px 35px #182e1c08}.paper .chapter-no{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:800}.paper h1{font:normal clamp(31px,6vw,43px)/1.15 Georgia,serif;margin:18px 0 18px;letter-spacing:-.75px}.paper .drop-lead{font:italic calc(var(--reader-size) + 1px)/var(--reader-leading) var(--serif);color:var(--muted);border-bottom:1px solid var(--hair);padding-bottom:22px;margin:0 0 24px}.paper p{font:var(--reader-size)/var(--reader-leading) var(--serif);margin:0 0 21px;word-wrap:break-word}.paper h2{font:25px Georgia,serif;color:var(--accent);margin:28px 0 14px}.paper .apply{background:var(--bg);border-left:3px solid var(--accent);padding:17px 17px 1px;margin:27px 0;border-radius:0 12px 12px 0}.paper .apply b{font:800 11px Arial,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}.paper .apply p{font-size:calc(var(--reader-size) - 1px);line-height:1.68;margin:11px 0 16px}.paper .quote{font:italic 22px/1.45 Georgia,serif;text-align:center;padding:16px 12px;color:var(--accent)}.chapter-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 0}.outline{width:100%;border:1px solid var(--hair);color:var(--ink);background:var(--page);border-radius:13px;padding:12px 14px;text-align:left}.chapter-drawer{display:none;margin:12px 0 20px}.chapter-drawer.show{display:grid;gap:6px}.chapter-drawer button{text-align:left;padding:11px;border:1px solid var(--hair);border-radius:8px;color:var(--ink);background:var(--page)}.chapter-drawer button.sel{border-color:var(--accent);color:var(--accent)}.control-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tabs{display:flex;gap:7px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}.tabs button{flex-shrink:0;border:1px solid var(--hair);background:var(--page);color:var(--ink);border-radius:100px;padding:9px 13px;font-size:12px}.tabs button.sel{background:var(--accent);color:var(--page)}.mantra{border:1px solid var(--hair);border-radius:17px;background:var(--page);padding:18px;margin:0 0 11px}.mantra .words{font:21px/1.4 Georgia,serif;margin:9px 0 14px}.input{width:100%;border:1px solid var(--hair);background:var(--page);color:var(--ink);padding:13px 14px;border-radius:12px;outline:none}.input::placeholder{color:var(--muted)}textarea.input{resize:vertical;min-height:100px;line-height:1.6}.habit{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--hair);padding:12px 0;line-height:1.4;font-size:14px}.habit:last-child{border-bottom:0}.habit input{accent-color:var(--accent);width:19px;height:19px;flex-shrink:0}.editor-row{display:grid;gap:5px;margin:15px 0}.editor-row label{font-size:11px;letter-spacing:1px;font-weight:800;color:var(--accent);text-transform:uppercase}.notice{background:var(--bg);border:1px solid var(--hair);border-radius:12px;padding:14px;line-height:1.6;font-size:13px;color:var(--muted)}.quiz-choice{display:block;width:100%;margin:8px 0;text-align:left;padding:14px;border:1px solid var(--hair);border-radius:11px;color:var(--ink);background:var(--page);line-height:1.5}.quiz-choice.selected{border-color:var(--accent);background:var(--bg)}.quiz-choice.right{border-color:#589674}.quiz-choice.wrong{border-color:#c17969}.meter{height:7px;border-radius:30px;background:var(--hair);overflow:hidden}.meter b{display:block;height:100%;background:var(--accent);transition:width .25s}.stat-chart{display:flex;gap:8px;align-items:flex-end;height:126px;margin-top:22px}.stat-chart .bar{flex:1;min-width:0;background:var(--accent2);border-radius:6px 6px 0 0;position:relative;min-height:4px}.stat-chart .bar span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;z-index:30;background:var(--ink);color:var(--page);font-size:13px;border-radius:12px;padding:12px 18px;box-shadow:0 10px 30px #0004;max-width:85vw;opacity:0;pointer-events:none;transition:opacity .2s}.toast.visible{opacity:1}.settings-panel{position:fixed;top:74px;right:max(10px,calc((100vw - 1050px)/2 + 14px));z-index:20;padding:20px;width:min(350px,calc(100vw - 30px));background:var(--page);border:1px solid var(--hair);border-radius:18px;box-shadow:0 15px 40px #0002}.settings-panel[hidden]{display:none}.line{border-top:1px solid var(--hair);margin:16px 0}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(min-width:700px){.view{padding:30px 32px}.shelf{grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}.bookcover{min-height:220px}.hero{padding:33px 36px}.nav{border-radius:20px 20px 0 0}}@media(max-width:360px){.cover-title{font-size:17px}.hero-quote{font-size:22px}.top{padding:0 10px}.bookcover{padding:12px 9px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}} 

/* v1.1 — author's ideas first, fast before deep */
.reader .paper{padding:clamp(18px,4.5vw,45px)}
.quick-title{display:flex;align-items:center;gap:11px;margin:23px 0 14px}
.quick-title strong{display:block;font:23px Georgia,serif;letter-spacing:-.3px}
.quick-title small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.quick-star{height:38px;width:38px;display:grid;place-items:center;border-radius:13px;background:var(--accent2);color:var(--accent);font-size:22px}
.fast-card{border:1px solid var(--hair);border-radius:16px;padding:19px;background:var(--bg)}
.mini-eyebrow{font:800 10px/1.5 Arial,sans-serif;letter-spacing:1.45px;color:var(--accent);margin-bottom:8px}
.fast-card p,.author-case p,.learning-case p{font:calc(var(--reader-size) - 2px)/1.62 var(--serif);margin:0 0 18px}
.fast-card p:last-of-type{margin-bottom:12px}
.one-line{padding:13px 14px;border-radius:10px;background:var(--accent2);font:700 16px/1.45 Arial,sans-serif;color:var(--ink);margin-top:10px}
.one-line span{display:block;font:800 10px Arial,sans-serif;letter-spacing:1.4px;margin-bottom:7px;color:var(--accent)}
.author-case{margin-top:22px;background:var(--page);border:1px solid var(--accent);border-radius:13px;padding:17px}
.author-case p{margin:0 0 10px}
.source-note,.learning-case small{font:12px/1.6 Arial,sans-serif;color:var(--muted);display:block}
.learning-case{margin-top:18px;border:1px dashed var(--hair);padding:18px;border-radius:13px}
.learning-case p{margin:0 0 10px}
.deep-dive{margin:23px 0 0;border:1px solid var(--hair);border-radius:12px;overflow:hidden}
.deep-dive summary{padding:18px;background:var(--bg);cursor:pointer;font:700 16px/1.3 Arial,sans-serif;list-style:none}
.deep-dive summary::-webkit-details-marker{display:none}
.deep-dive summary span{float:right;color:var(--accent);font-size:20px}
.deep-dive summary small{font:12px/1.45 Arial,sans-serif;color:var(--muted);display:block;margin-top:7px}
.deep-dive[open] summary span{transform:rotate(45deg)}
.deep-content{padding:0 17px 17px}
.deep-content h2{margin-top:23px}
@media(max-width:390px){.fast-card{padding:15px}.one-line{font-size:15px}.reader .paper h1{font-size:29px}}
</style></head><body data-theme="sepia"><div class="app"><header class="top"><div class="mark" aria-hidden="true">R</div><div class="brand"><b>Mindful Reader</b><small id="barTitle">YOUR DAILY READER</small></div><button class="iconbtn" id="searchButton" aria-label="Search library">⌕</button><button class="iconbtn" id="settingsButton" aria-label="Reading settings">⚙</button></header><main id="main" aria-live="polite"></main><nav class="nav" id="nav" aria-label="Main navigation"></nav><aside class="settings-panel" id="settingsPanel" hidden><div class="row"><strong style="font:24px Georgia,serif">Reading settings</strong><button class="iconbtn" id="closeSettings" aria-label="Close settings">×</button></div><div class="line"></div><div class="eyebrow">PAGE COLOR</div><div class="control-row" style="margin-top:12px"><button class="btn secondary tiny" data-theme-set="sepia">Sepia</button><button class="btn secondary tiny" data-theme-set="light">White</button><button class="btn secondary tiny" data-theme-set="dark">Dark</button></div><div class="line"></div><div class="eyebrow">TEXT SIZE</div><div class="row" style="margin-top:12px"><button class="btn secondary" id="fontLess" aria-label="Decrease font size">A−</button><span class="small" id="fontLabel">19 px</span><button class="btn secondary" id="fontMore" aria-label="Increase font size">A+</button></div><p class="small">Settings and reading progress stay on this device.</p></aside><div class="toast" id="toast" role="status" aria-live="polite"></div></div><script>window.READER_CONTENT={
  "books": [
    {
      "id": "mental",
      "title": "The Mental Game of Trading",
      "author": "Jared Tendler",
      "subtitle": "Identify emotional patterns. Fix root causes. Execute consistently.",
      "tag": "TRADING PSYCHOLOGY",
      "color": "#b18b4c",
      "overview": "This book treats trading errors as recurring, diagnosable performance patterns rather than moral failings. Its system moves from mapping emotional escalation to finding the belief or learning error behind it, then correcting that error during real decisions. It covers greed, fear, tilt, confidence, discipline, and troubleshooting. It does not teach trading setups or prove that psychology alone produces profitability: a real trading edge and risk controls are still necessary.",
      "chapters": [
        {
          "id": "mental-1",
          "number": 1,
          "title": "A System to Fix Mental Game Problems",
          "key": "Trading errors often persist because the trader manages symptoms rather than their underlying cause. Emotions are information about how the trader interprets an event, not automatically an enemy to suppress. The starting system has three stages: map the pattern, identify the root, and correct it repeatedly.",
          "deep": "Technical skill and emotional skill must be developed separately. A trader may accurately identify an entry but sabotage execution through chasing, premature exits, or changing a stop. Temporary calm is not the same as solving the thought that triggers the behavior. Improvement requires observation, a causal hypothesis, and repetition.",
          "example": "You entered a valid setup, but a quick adverse candle provoked panic. Rather than saying “I am weak,” record what you feared would happen and how your decision changed.",
          "practice": "Write the costliest rule violation from your last ten trades. Record its first warning sign, the thought underneath it, and one new response.",
          "mantra": "Find the pattern, not a person to blame.",
          "quick": {
            "plain": "Your market knowledge and your emotional habits are two different skills. You can know an entry is good and still execute it poorly.",
            "pattern": "When the same error repeats, stop promising to be disciplined; investigate what repeatedly triggers it.",
            "remember": "A repeat mistake needs a repeatable correction."
          }
        },
        {
          "id": "mental-2",
          "number": 2,
          "title": "Map Your Pattern",
          "key": "Recognize the earliest signs of an emotional episode before decisions degrade. A useful map includes triggers, thoughts, bodily sensations, impulses, actions, and consequences. Describe the pattern at low, medium, and high intensity so the first warning sign becomes actionable.",
          "deep": "Emotional escalation often feels sudden only because its early stages were missed. Notice accelerated breathing, fixation on recovering, repeatedly checking P&L, and the urge to click. The aim is not to be emotionless; it is to see the sequence early enough to choose your planned behavior.",
          "example": "A loss produces mild irritation, then thoughts of recovering quickly, then larger position sizes. Your intervention belongs at the first “I must recover now” thought, not after the oversized order.",
          "practice": "Create a three-level map: 2/10, 5/10 and 8/10 emotion. Write the visible behavior at each level.",
          "mantra": "Early recognition is my edge over impulse.",
          "quick": {
            "plain": "An emotional blow-up usually has a beginning, middle and end. Learn to spot the beginning, not only the disaster.",
            "pattern": "After a loss, look for the first urge to recover immediately, then take your planned pause.",
            "remember": "Catch the first spark, not the fire."
          },
          "source_example": {
            "text": "Tendler recommends constructing a detailed map of an emotional pattern, including how it escalates, so that its earliest signs can be recognised during trading.",
            "reference": "The Mental Game of Trading, ch. 2"
          }
        },
        {
          "id": "mental-3",
          "number": 3,
          "title": "Find the Root of Your Problem",
          "key": "A surface habit can come from a mistaken belief: “I must win today,” “every valid setup must profit,” or “one loss proves I am incapable.” Investigating these assumptions is more lasting than merely promising to stop. The Inchworm Concept describes uneven development: strengths improve while weaker habits still lag.",
          "deep": "Separate an ordinary loss within your system from a process error. When results are uncertain, a good decision can lose money and a bad decision can make money. Progress becomes steadier when you improve your weakest repeatable behaviors rather than measuring yourself only by your best days.",
          "example": "Two losing trades tempt you to double size because you interpret losses as unacceptable. The root may be the demand to finish every session green.",
          "practice": "Ask “What did this result mean about me?” and then “Is that meaning a fact or an assumption?”",
          "mantra": "Correct the belief underneath the click.",
          "quick": {
            "plain": "An impulsive trade is often the visible symptom of a hidden demand: I must win, I must be right, or this loss is unfair.",
            "pattern": "Ask what you believed the loss proved; challenge that belief before your next trade.",
            "remember": "Treat the root, not the symptom."
          },
          "source_example": {
            "text": "Tendler uses his Inchworm Concept to explain why improving the best part of your game is different from eliminating weak habits at the other end of your range.",
            "reference": "The Mental Game of Trading, ch. 3"
          }
        },
        {
          "id": "mental-4",
          "number": 4,
          "title": "Greed",
          "key": "Greed appears as pressure for more: extra trades, oversized positions, unrealistic targets, or refusing to accept adequate gains. Tendler treats it as a pattern with identifiable beliefs and triggers, not simply a universal desire for profit.",
          "deep": "Distinguish ambition from compulsive maximization. A disciplined trader can have large goals while honoring limits. The dangerous moment is when a profit becomes evidence you deserve more, or a good opportunity feels inadequate unless it produces an outsized result.",
          "example": "After a planned 1R gain, you abandon the daily stop and force a low-quality second trade because the market “owes” you a bigger day.",
          "practice": "Write your maximum size, trade count, and daily loss boundary before the market opens. No exceptions after a win.",
          "mantra": "Enough is a rule, not a feeling.",
          "quick": {
            "plain": "Wanting profit is normal. Greed becomes a problem when the need for more overrides your predefined process.",
            "pattern": "If your target is reached and you suddenly want bigger size, compare that urge with your daily risk policy.",
            "remember": "Ambition follows rules; greed edits them."
          }
        },
        {
          "id": "mental-5",
          "number": 5,
          "title": "Fear",
          "key": "Fear can produce FOMO, avoiding legitimate losses, hesitating on good entries, fear of mistakes, and fear of failure. It often reflects a belief that uncertainty or a negative result is personally dangerous. The solution is to recognize the precise fear and test the assumption behind it.",
          "deep": "FOMO and hesitation look opposite but both let anticipated discomfort make decisions. Prepare entry criteria, planned risk and acceptable outcomes before price moves. An appropriate loss is part of the distribution of a tested system; it is not proof of personal inadequacy.",
          "example": "You skip a valid setup after yesterday’s loss, then chase it at a worse price. Fear first blocks the planned trade and then causes an impulsive one.",
          "practice": "For the next demo session, record every valid setup you did or did not take and why. Grade rule compliance, not outcome.",
          "mantra": "Uncertainty is permitted. Rule breaking is optional.",
          "quick": {
            "plain": "Fear is not always one thing. Fear of missing out, being wrong, losing money and failing can produce opposite mistakes.",
            "pattern": "If you hesitate at a valid entry or chase later, name the fear that caused both.",
            "remember": "Name the fear before it names your action."
          }
        },
        {
          "id": "mental-6",
          "number": 6,
          "title": "Tilt",
          "key": "Tilt is an emotionally driven loss of decision quality. Anger may arise from hating to lose, mistakes, perceived injustice, revenge, or entitlement. Identify the type instead of treating every angry trade as the same problem.",
          "deep": "When market movement feels personally unfair, the trader can shift from executing an edge to demanding emotional repayment. A market is not a moral referee. A cooling period protects the trading account while the underlying belief is examined.",
          "example": "After a stop-loss is hit by one tick, you immediately buy again without a setup to prove the previous exit was wrong.",
          "practice": "Create a 10-minute no-order rule after an anger spike. If your stop condition has been reached, close the session entirely.",
          "mantra": "The market owes me nothing.",
          "quick": {
            "plain": "Tilt is the moment frustration controls execution. Revenge trading is an attempt to correct your feelings by placing another order.",
            "pattern": "After a painful loss, do not use a new trade to erase the emotion of the old one.",
            "remember": "An angry click is not a setup."
          }
        },
        {
          "id": "mental-7",
          "number": 7,
          "title": "Confidence",

        {

        {

        {
          "id": "gut-6",

        {

          "deep": "The book uses evolutionary comparisons to examine diet, but no ancestral pattern is automatically ideal for every person. Variety, tolerability and nutritional adequacy matter more than novelty or fashionable labels.",

      "chapters": [
        {

        {

          "key": "Pulses, beans, paneer, yogurt, tofu, soya products, sprouts and, for ovo-vegetarians, eggs can help meet protein needs. The book demonstrates the diversity of vegetarian protein sources.",

        {

    {
      "id": "zone",
      "title": "Trading in the Zone",
      "author": "Mark Douglas",
      "subtitle": "Learn to think in probabilities and accept uncertainty.",
      "tag": "PROBABILISTIC MINDSET",
      "color": "#505e78",
      "overview": "Douglas argues that consistent trading requires a belief system compatible with uncertain outcomes. Traders often know technical analysis but behave as though every trade should be predictable. The chapters examine responsibility, perceived risk, beliefs, and probabilistic thinking. The practical goal is not certainty or guaranteed returns, but a repeatable method executed without demanding that any individual outcome prove your worth.",
      "chapters": [
        {
          "id": "zone-1",
          "number": 1,
          "title": "The Road to Success: Fundamental, Technical, or Mental Analysis?",
          "key": "Technical tools identify potential opportunities, but a mental framework determines whether a trader can execute a method consistently. Trading success cannot be reduced to knowing a chart pattern.",
          "deep": "A person may understand moving averages and price action yet hesitate on valid signals, chase invalid ones, or change stops. Skills in market analysis and skills in handling uncertainty are distinct and both need development.",
          "example": "You correctly recognized a setup but cancelled a predefined stop because the loss felt unacceptable.",
          "practice": "Write one technical skill you possess and one execution behavior it has not yet solved.",
          "mantra": "A good setup still needs a good decision.",
          "quick": {
            "plain": "Technical analysis may identify opportunity, but mental skill determines whether you can execute your edge reliably.",
            "pattern": "Notice whether rule violations appear even when your market analysis was right.",
            "remember": "An edge is not execution."
          }
        },
        {
          "id": "zone-2",
          "number": 2,
          "title": "The Lure and Dangers of Trading",
          "key": "Markets offer freedom, rapid feedback and the possibility of gains; these attractions coexist with unusual emotional and financial risks. Trading provides fewer external boundaries than many other activities.",
          "deep": "Because nobody forces you to stop after a poor decision, personal rules become crucial. The opportunity to act at almost any moment can turn into a compulsion to keep acting. Protecting capital and attention requires defined boundaries.",
          "example": "You can trade multiple expiries all day, but your process may support only two well-chosen setups.",
          "practice": "Write the exact situations in which you must not place an order.",
          "mantra": "Freedom without boundaries becomes danger.",
          "quick": {
            "plain": "Trading provides freedom, constant choices and no guaranteed result. That freedom exposes hidden habits.",
            "pattern": "Write down rules before opening the platform, because the market will not impose your limits for you.",
            "remember": "Freedom needs self-imposed boundaries."
          }
        },
        {
          "id": "zone-3",
          "number": 3,
          "title": "Taking Responsibility",
          "key": "Owning results means accepting that your choices, interpretation and risk controls are your responsibility, even when the market behaves unpredictably. Responsibility is not the same as self-blame.",
          "deep": "You cannot control price movement or every execution outcome, but you can choose risk, preparation and response. Avoid making the market personally responsible for an emotion. Focus on the levers you can actually adjust.",
          "example": "Slippage is frustrating. You still need a plan for liquidity and position size instead of assuming it is personal injustice.",
          "practice": "After the next trade, list what was in your control and what was not.",
          "mantra": "Responsibility restores choices.",
          "quick": {
            "plain": "Markets owe no individual trader a win. Responsibility means owning how you interpret and respond to outcomes.",
            "pattern": "Stop asking why the market did this to you and review risk, execution and uncertainty.",
            "remember": "Own the response, not the market."
          }
        },
        {
          "id": "zone-4",
          "number": 4,
          "title": "Consistency: A State of Mind",
          "key": "Consistency depends partly on how a trader defines risk, opportunity and failure. Acting from probabilities is easier when one trade does not threaten identity or financial survival.",
          "deep": "A stable process means individual wins and losses do not dictate whether the next signal is valid. It also requires an actual, tested trading edge. Consistency is not a promise of a constant positive daily result.",
          "example": "A single stop-loss does not justify replacing your entire system by lunchtime.",
          "practice": "Track a 20-trade sample of rule compliance separately from returns.",
          "mantra": "One result does not define the system.",
          "quick": {
            "plain": "Consistency depends on how you interpret uncertainty. A trader can be confident in a process while unsure about any single trade.",
            "pattern": "A valid stop-out can occur on a disciplined day; do not score the whole day as failure.",
            "remember": "Consistency starts in the mind."
          }
        },
        {
          "id": "zone-5",
          "number": 5,
          "title": "The Dynamics of Perception",
          "key": "Perception is filtered through expectations, memories and beliefs. Traders do not always see the same chart information with the same emotional meaning.",
          "deep": "A past large loss can make a neutral setup feel dangerous; a recent winning streak may make a weak setup look irresistible. Detect the interpretation you are placing on market information before acting.",
          "example": "After a painful stop, you see danger everywhere and avoid a valid setup.",
          "practice": "Write the raw chart facts separately from your personal interpretation.",
          "mantra": "See the market, not yesterday’s story.",
          "quick": {
            "plain": "What you notice is shaped by prior beliefs and emotional associations. Two traders can read the same chart differently.",
            "pattern": "After a painful breakout failure, you may see false breakouts everywhere; check your objective rules.",
            "remember": "Perception is filtered."
          },
          "source_example": {
            "text": "Douglas describes a client who is frightened of snakes while the client’s young daughter is fascinated by a pet snake. The same object elicits different perceptions and emotions.",
            "reference": "Trading in the Zone, ch. 5, approx. PDF pp. 73–74"
          }
        },
        {
          "id": "zone-6",
          "number": 6,
          "title": "The Market’s Perspective",
          "key": "The market offers possibilities, not promises. A trader benefits from remaining open to information without demanding that reality match a personal forecast.",
          "deep": "Entering with a thesis is compatible with knowing it can fail. Rigidity makes the trader reinterpret warning signs to protect being right. Flexibility is not random decision-making; it means the plan has explicit invalidation rules.",
          "example": "A breakout fails your predefined confirmation. You stand aside even though you wanted it to work.",
          "practice": "Add a “What would invalidate this idea?” line to every pre-trade plan.",
          "mantra": "My opinion is not a market obligation.",
          "quick": {
            "plain": "The market offers changing information, not guarantees. Stay open to its next movement instead of defending yesterday's belief.",
            "pattern": "When a breakout lacks confirmation, follow the evidence rather than the forecast.",
            "remember": "The market does not know your opinion."
          }
        },
        {
          "id": "zone-7",
          "number": 7,
          "title": "The Trader’s Edge: Thinking in Probabilities",
          "key": "A real edge only tilts the odds over a series of opportunities. Each individual trade remains uncertain. Treat outcomes as variable rather than signs that you can predict the next candle with certainty.",
          "deep": "A 60% estimated win rate, even if valid, still allows sequences of losses. Sample size, transaction costs and changing conditions matter. Probabilistic thinking helps reduce the demand for certainty before every entry.",
          "example": "A carefully planned losing trade may still be consistent with your strategy’s tested distribution.",
          "practice": "Write “This trade can lose and still be valid” next to the risk amount.",
          "mantra": "My edge is statistical, not prophetic.",
          "quick": {
            "plain": "A profitable edge is a probability across many attempts, not a promise about the next trade. The author uses casinos as an analogy.",
            "pattern": "Judge a well-defined series of trades instead of demanding that one setup win.",
            "remember": "Think in samples, not single outcomes."
          },
          "source_example": {
            "text": "Douglas compares an individual trade with an individual casino bet: the next outcome is uncertain, while a valid edge concerns the distribution of many outcomes.",
            "reference": "Trading in the Zone, ch. 7, approx. PDF p. 108"
          }
        },
        {
          "id": "zone-8",
          "number": 8,
          "title": "Working with Your Beliefs",
          "key": "Beliefs influence what you notice and how you respond. Some beliefs support measured risk-taking while others create hesitation or urgency.",
          "deep": "You can examine whether a belief is accurate and useful. “Every loss is a mistake” prevents tolerance of normal losses; “Any one trade can lose” encourages risk planning. A belief needs repeated evidence and practice to become operational.",
          "example": "You notice you feel compelled to make money every day because you equate a red day with failure.",
          "practice": "Identify one belief behind a trading error and a more evidence-compatible alternative.",
          "mantra": "I can revise beliefs that sabotage execution.",
          "quick": {
            "plain": "Beliefs shape what feels possible or threatening. You can practice new reactions when old beliefs no longer serve you.",
            "pattern": "If you believe a loss is unacceptable, write a neutral statement about expected losing trades.",
            "remember": "Question the hidden rule."
          }
        },
        {
          "id": "zone-9",
          "number": 9,
          "title": "The Nature of Beliefs",
          "key": "Beliefs can feel certain because they have been reinforced emotionally or through selective attention. Their emotional force does not make them universally true.",
          "deep": "Recognize when prior learning collides with market uncertainty. A trader who excelled through accuracy in another job may struggle with a market where even correct processes have failures. Beliefs can be updated through direct, manageable experience.",
          "example": "You used to be rewarded for always having the right answer; in trading, accepting uncertainty is part of competence.",
          "practice": "Write a rule that honors uncertainty without undermining responsibility.",
          "mantra": "Confidence does not require certainty.",
          "quick": {
            "plain": "Beliefs feel like reality but arise through learning and experience. They can guide attention without being objectively true.",
            "pattern": "The feeling that every red day proves incompetence is an interpretation, not market data.",
            "remember": "Strongly felt does not mean true."
          }
        },
        {
          "id": "zone-10",
          "number": 10,
          "title": "The Impact of Beliefs on Trading",
          "key": "Beliefs shape attention, expectations and reaction to profits and losses. What you anticipate emotionally can become the driver of entry or exit behavior.",
          "deep": "If you believe you must avoid any regret, you may close winners prematurely or avoid losses by moving stops. Review the meaning you assign to normal events. A systematic process should make important decisions before emotion peaks.",
          "example": "You exit early because profit turning into a loss feels unbearable even when the exit signal has not occurred.",
          "practice": "After each premature exit, note the belief that made discomfort feel dangerous.",
          "mantra": "I trade my criteria, not my fear of regret.",
          "quick": {
            "plain": "Contradictory beliefs create conflicting actions. Wanting to hold winners while fearing any giveback can prompt premature exits.",
            "pattern": "Define exit criteria beforehand so fear is less likely to rewrite the rule.",
            "remember": "Find the belief behind the exception."
          }
        },
        {
          "id": "zone-11",
          "number": 11,
          "title": "Thinking Like a Trader",
          "key": "The book culminates in practical mindset work: acceptance of risk, commitment to tested rules, recognition of uncertainty and repetition across a series of opportunities.",
          "deep": "A trader cannot force the market to provide favorable outcomes. They can train preparation, decision criteria, risk acceptance and consistent execution. Treat practice as a skill-building process, not as proof you have achieved a permanently perfect mental state.",
          "example": "You take a valid simulated trade with predefined risk and allow it to resolve without ad hoc interference.",
          "practice": "For your next 20 replay trades, score whether every decision matched your written plan.",
          "mantra": "I execute one probability at a time.",
          "quick": {
            "plain": "Thinking like a trader means accepting uncertainty, knowing risk, believing in an edge and treating each outcome as unique.",
            "pattern": "Rehearse executing a series of predefined setups without forcing certainty about any one.",
            "remember": "Execute the edge, accept variance."
          },
          "source_example": {
            "text": "Douglas offers a set of fundamental trading truths centred on uncertainty, statistical advantage and the uniqueness of each market moment.",
            "reference": "Trading in the Zone, ch. 11 and ch. 7"

    {
      "id": "loser",
      "title": "Best Loser Wins",
      "author": "Tom Hougaard",
      "subtitle": "Change how you respond to being wrong and to winning.",
      "tag": "TRADING & LOSSES",
      "color": "#886044",
      "overview": "Hougaard describes trading as a psychological contest with ordinary human instincts: avoiding the pain of loss, trying to secure gains too quickly, and relying on chart knowledge without corresponding mental preparation. His personal experiences challenge readers to examine how they behave under pressure. Some techniques he discusses, including adding to winning trades, increase complexity and risk; this app treats them as concepts to study, not recommendations to copy.",
      "chapters": [
        {
          "id": "loser-1",
          "number": 1,
          "title": "Dear Markets",
          "key": "The opening uses a personal relationship with markets to show how fascination and pain can coexist. The author’s key turn is from trying to decode every market move to understanding his own reactions.",
          "deep": "Market knowledge helps, but an obsession with being right can conceal harmful habits. Approach losses as information about both your method and your emotional responses. Keep financial risk within boundaries.",
          "example": "You keep changing indicators instead of examining why you ignore your existing stop.",
          "practice": "Describe the three trading behaviors you most want to change.",
          "mantra": "Understand your response, not just the candle.",
          "quick": {
            "plain": "The author describes becoming fascinated by markets and learning that understanding himself mattered as much as understanding price.",
            "pattern": "When the same trading mistake returns, ask what it reveals about your response to uncertainty.",
            "remember": "The hardest chart is sometimes yourself."
          }
        },
        {
          "id": "loser-2",
          "number": 2,
          "title": "Preface",
          "key": "The preface introduces failure and loss as unavoidable features of active trading. The issue is how a trader responds, not whether every setback can be prevented.",
          "deep": "Resilience is not an invitation to lose more money. It is the capacity to accept controlled losses and protect future decisions. Loss tolerance must remain compatible with prudent capital management.",
          "example": "You hit your planned loss limit and stop without trying to prove toughness by taking more risk.",
          "practice": "Define the acceptable financial loss before you begin.",
          "mantra": "Accept losses; never romanticize them.",
          "quick": {
            "plain": "Losses are an unavoidable fee for participating in uncertain markets. The question is how you deal with them.",
            "pattern": "Practice taking your planned stop without turning it into a personal defeat.",
            "remember": "Learn to lose before trying to win."
          }
        },
        {
          "id": "loser-3",
          "number": 3,
          "title": "Introduction",
          "key": "The book frames trading performance as behavior under uncertainty rather than chart expertise alone. Everyday instincts may be poorly suited to financial risk.",
          "deep": "People naturally prefer a quick sure gain over waiting and often avoid realizing losses. These impulses can conflict with a systematic approach, but not every contrarian action is wise. The strategy still needs empirical justification.",
          "example": "You notice that you are relieved to close a small winner but keep an invalid losing trade open.",
          "practice": "Compare how you manage a winner and a loser in your journal.",
          "mantra": "My instincts deserve inspection.",
          "quick": {
            "plain": "Most people seek comfort by closing winners quickly and holding losers. The author challenges those reflexes.",
            "pattern": "Notice whether you are rewarding yourself with relief instead of following your exit rules.",
            "remember": "Comfort can be expensive."
          }
        },
        {
          "id": "loser-4",
          "number": 4,
          "title": "Liar’s Poker",
          "key": "Trading culture can reward bravado, persuasion and the appearance of certainty. Stories and bold predictions may be mistaken for skill.",
          "deep": "Confidence is cheap to display, but risk-adjusted repeatability is harder to establish. Judge strategies by process and credible evidence rather than exciting anecdotes.",
          "example": "A loud trading tip offers no tested edge or realistic loss limit.",
          "practice": "Write three pieces of evidence you would require before following a setup.",
          "mantra": "Evidence outranks bravado.",
          "quick": {
            "plain": "Stories from financial markets illustrate the temptation to appear clever and follow confident people. Neither supplies an edge by itself.",
            "pattern": "Do not use another person's conviction as a replacement for your tested criteria.",
            "remember": "A convincing story is not a plan."
          }
        },
        {
          "id": "loser-5",
          "number": 5,
          "title": "The Trading Floor",
          "key": "The author’s trading-floor experience contrasts the energy of professional markets with the reality of performance pressure. Environment and social signals can influence judgment.",
          "deep": "Noise, urgency and other traders’ reactions can make imitation tempting. A defined process helps distinguish useful information from crowd emotion.",
          "example": "A colleague’s sudden call causes you to chase a move without checking your setup.",
          "practice": "Mute sources of urgency during your primary decision window.",
          "mantra": "A loud room does not make a trade valid.",
          "quick": {
            "plain": "Being close to a trading floor reveals the speed, uncertainty and emotional behaviour beneath price charts.",
            "pattern": "When someone shouts a hot trade, notice whether it changes your process without new evidence.",
            "remember": "Market noise has a human source."
          },
          "source_example": {
            "text": "Hougaard recalls following the Dow’s Boxing Day 2018 rally on his phones while eating Christmas pudding and attending a social gathering, illustrating how consuming the market can become.",
            "reference": "Best Loser Wins, The Trading Floor, approx. PDF p. 38"
          }
        },
        {
          "id": "loser-6",
          "number": 6,
          "title": "Everyone Is a Chart Expert",
          "key": "Recognizing patterns is much easier than consistently acting on a trading system. Having charts and opinions does not automatically create profits.",
          "deep": "Many traders endlessly seek new indicators because chart study feels productive and less uncomfortable than confronting execution errors. But psychology cannot compensate for a strategy with no measurable edge. Both need testing.",
          "example": "You spot an accurate support level but enter three times early without waiting for confirmation.",
          "practice": "Separate chart accuracy and execution quality in your trade review.",
          "mantra": "Knowledge is not the same as execution.",
          "quick": {
            "plain": "Charts are easy to explain after the fact. Real-time execution is much harder because the next candle is unknown.",
            "pattern": "Replay a chart one candle at a time before claiming the setup was obvious.",
            "remember": "Hindsight is not foresight."
          }
        },
        {
          "id": "loser-7",
          "number": 7,
          "title": "The Curse of Patterns",
          "key": "Patterns can create an illusion of inevitability. Recognizing something familiar is not enough to know its probability, timing or expected return.",
          "deep": "Confirmation bias can make price action fit a favorite story. Define valid conditions, failure points and risk before ordering. Beware of extrapolating from attractive historical examples.",
          "example": "You see an apparent double bottom and enter before your confirmation candle closes.",
          "practice": "Write the conditions that would disqualify your favorite pattern.",
          "mantra": "A picture is not a promise.",
          "quick": {
            "plain": "Patterns can be useful but can also create false certainty. The trader must accept that recognizable shapes sometimes fail.",
            "pattern": "Do not enter a shape alone if your strategy also requires close, level and risk criteria.",

        },
        {
          "id": "loser-8",
          "number": 8,
          "title": "Fighting My Humanness",
          "key": "The author contrasts natural comfort-seeking responses with behavior demanded by his trading approach. Typical reactions include wanting immediate relief from uncertainty and losses.",
          "deep": "Do not interpret this as needing to be reckless or opposite to the crowd for its own sake. Instead, notice which automatic reactions contradict your tested plan. Work with small size and rehearsed controls while practicing new responses.",
          "example": "Your fear urges you to move a stop farther away; your written plan requires accepting the defined loss.",
          "practice": "Practice one rule that is emotionally uncomfortable but clearly risk controlled.",
          "mantra": "Comfort does not define correctness.",
          "quick": {
            "plain": "Many natural instincts favour taking tiny profits and avoiding realized losses. Professional trading often requires resisting those impulses.",
            "pattern": "Check whether you are changing a stop just to avoid feeling wrong.",
            "remember": "Train against reflexive comfort."
          }
        },
        {
          "id": "loser-9",
          "number": 9,
          "title": "Disgust",
          "key": "Strong aversion to losing, mistakes and market behavior can trigger impulsive reactions. The author explores how such emotion may interfere with decision-making.",
          "deep": "A disgust response can narrow attention to avoiding pain or proving a point. When this occurs, the highest-value decision may be to stop. Analyze what the emotion means to you later, outside the active market.",
          "example": "A quick stop-loss feels humiliating and provokes an impulse to re-enter instantly.",
          "practice": "Set a ten-minute no-order reset after strong aversion or anger.",
          "mantra": "I will not trade to erase a feeling.",
          "quick": {
            "plain": "A painful loss can create disgust, embarrassment or an urge to attack the market. Those emotions can sabotage the next trade.",
            "pattern": "Notice the body reaction to a sudden stop; pause before another order.",
            "remember": "Pain is not a trading signal."
          }
        },
        {
          "id": "loser-10",
          "number": 10,
          "title": "The Drifter Mind",
          "key": "Attention drifts toward fantasy, fear, prediction and distraction. Performance deteriorates when the mind leaves the actual current task.",
          "deep": "Repeatedly practice returning to observable information and a written method. A wandering thought is not a moral problem; acting on it without checking your criteria is the risk.",
          "example": "During a slow session, you imagine your future profit and enter an unplanned trade.",
          "practice": "Name your distraction; return to the next specific checklist item.",
          "mantra": "Return to what is observable.",
          "quick": {
            "plain": "Attention drifts, especially when waiting. A wandering mind may invent reasons to enter.",
            "pattern": "If you realize you are daydreaming about profits, return to observing your criteria.",
            "remember": "Guard attention during boredom."

        },
        {
          "id": "loser-11",
          "number": 11,
          "title": "Trading Through a Slump",
          "key": "A slump tests confidence and reveals how results affect risk decisions. Changing everything after a small sample can deepen instability.",
          "deep": "First distinguish a normal losing streak from evidence that market conditions or the strategy have changed. Consider transaction costs, volatility, execution errors and risk limits. If uncertain, reduce exposure or return to demo rather than revenge trade.",
          "example": "After four losses you review the sample and pause live execution instead of doubling size.",
          "practice": "Create a slump protocol including reduced size, review and explicit return criteria.",
          "mantra": "A slump requires analysis, not desperation.",
          "quick": {
            "plain": "Losing streaks can cause desperation, risk escalation and strategy hopping. Respond through review and planned limits.",
            "pattern": "If your conditions or mental state are poor, step back rather than trying to force recovery.",
            "remember": "A slump needs process, not panic."
          }
        },
        {
          "id": "loser-12",
          "number": 12,
          "title": "Embracing Failure",
          "key": "Controlled failures can be a cost of participation in a probabilistic activity. Learning requires examining mistakes and legitimate losses without personal collapse.",
          "deep": "Acceptance never means tolerating unlimited damage. Separate a valid stop from a broken rule, log both accurately and improve the controllable part. A failed trade can teach; it does not need to become an identity story.",
          "example": "You accept a 1R loss and do not change your position size in anger.",
          "practice": "For every red trade, record “valid loss” or “process error” with a reason.",
          "mantra": "A measured loss can be handled well.",
          "quick": {
            "plain": "Accepting failure in individual trades is part of executing an uncertain strategy. Fear of losing can be more costly than the loss itself.",
            "pattern": "Practice taking planned losses without changing size to repair your ego.",
            "remember": "A clean loss is useful feedback."
          }
        },
        {
          "id": "loser-13",
          "number": 13,
          "title": "Best Loser Wins",
          "key": "The central theme is that disciplined responses to losses and discomfort may distinguish a durable trader from someone who pursues emotional relief. The author also discusses approaches to managing winners differently from losers.",
          "deep": "The book challenges reflexive early profit-taking and suggests studying how a method handles favorable moves. However, adding to winners can increase exposure and risk; never copy this technique without a validated system, explicit aggregate risk control, and suitable experience.",
          "example": "A planned stop is hit. You take the loss, review it later and keep the next trade independent of the last.",
          "practice": "Grade the quality of how you accepted a loss instead of trying to glorify losing money.",
          "mantra": "Lose responsibly; remain capable of the next good decision.",
          "quick": {
            "plain": "The author's thesis is about tolerating losing rather than avoiding it. He also discusses adding to winners, a higher-risk technique that is not required for beginners.",
            "pattern": "First master defined risk and honest review; do not interpret the book as permission to increase leverage.",
            "remember": "Become skilled at the loss first."
          },
          "source_example": {
            "text": "Hougaard compares adding an equal number of lots to a winning position with adding a smaller subsequent position. He recommends the smaller-addition approach until the trader has experience, while recognising the risk.",
            "reference": "Best Loser Wins, Best Loser Wins, approx. PDF p. 157"
          }
        },
        {
          "id": "loser-14",
          "number": 14,
          "title": "The Ideal Mindset",
          "key": "The closing themes combine mental preparation, self-observation, willingness to face discomfort and structured risk control. The goal is a practiced approach rather than dramatic motivation.",
          "deep": "Prepare for both winning and losing scenarios. Keep humility during success and steadiness after setbacks. A durable mindset is supported by records and practice, not by claiming fear or uncertainty have vanished.",
          "example": "You end your session when your plan says stop, regardless of whether the last trade was green or red.",
          "practice": "Write your ideal behavior during three states: after loss, after win and during boredom.",
          "mantra": "Professionalism is repeated behavior.",
          "quick": {
            "plain": "An ideal trading mindset tolerates uncertainty, remains prepared and refuses to define worth by the last trade.",
            "pattern": "Score yourself on entry validity, risk and exit discipline, not just green or red P&L.",
            "remember": "Trade the plan, not the scoreboard."
          }
        }
      ]
    }

;</script><script>(()=>{'use strict';

function library(){let last=BOOKS.find(b=>b.id===S.book)||BOOKS[0];let today=MANTRAS[((new Date().getFullYear()*372+Math.floor(Date.now()/86400000))%MANTRAS.length)];return `<section class="view"><div class="eyebrow">MIND • DISCIPLINE • NOURISHMENT</div><h1 class="h1">A quieter mind.<br>A stronger process.</h1><p class="intro">A personal Kindle-inspired study companion. Six books distilled into original, chapter-by-chapter explanations and practical exercises.</p><div class="hero" style="margin:19px 0"><span class="pill">TODAY'S MANTRA</span><div class="hero-quote">${escapeHtml(today.text)}</div><div class="row"><span class="small">A brief reset before trading</span><button class="btn tiny" data-act="nav" data-id="mantras">More mantras →</button></div></div><div class="row"><h2 class="section-title">Your bookshelf</h2><span class="small">${totalRead()} / ${BOOKS.reduce((s,b)=>s+b.chapters.length,0)} chapters</span></div><div class="shelf">${BOOKS.map(b=>`<button class="bookcard" data-act="outline" data-id="${b.id}" aria-label="Open ${escapeHtml(b.title)}"><div class="bookcover" style="--cover:${b.color}"><span class="cover-kicker">${escapeHtml(b.tag)}</span><span class="cover-title">${escapeHtml(b.title)}</span><span class="cover-author">${escapeHtml(b.author)}</span></div><div class="book-info"><strong>${escapeHtml(b.title)}</strong><span>${b.chapters.length} study chapters · ${readPct(b)}% complete</span><div class="progress"><i style="width:${readPct(b)}%"></i></div></div></button>`).join('')}</div><h2 class="section-title">Keep going</h2><div class="card row"><div><strong>${escapeHtml(last.title)}</strong><div class="small">Continue the next concept</div></div><button class="btn tiny" data-act="open" data-id="${last.id}">Read →</button></div><p class="small" style="margin-top:18px">Independent study summaries, examples and mantras — not the full texts or original recipes. Saved privately on this device.</p></section>`}

function reader(){
 const b=getBook(),c=b.chapters[S.chapter]||b.chapters[0],savedBookmark=S.bookmarks.includes(c.id),done=!!S.read[c.id],q=c.quick||{};

 return `<section class="view reader">

   </article>
   <div class="chapter-foot"><button class="btn secondary tiny" data-act="prev" ${S.chapter===0?'disabled':''}>← Previous</button><button class="btn ${done?'secondary':''} tiny" data-act="mark">${done?'✓ Finished':'Mark as read'}</button><button class="btn secondary tiny" data-act="next" ${S.chapter===b.chapters.length-1?'disabled':''}>Next →</button></div>
   <div class="card"><div class="row"><strong>Chapter index</strong><button class="btn secondary tiny" data-act="toggleOutline">Expand / collapse</button></div><div class="chapter-drawer" id="drawer">${b.chapters.map((item,i)=>`<button class="${i===S.chapter?'sel':''}" data-act="gochapter" data-index="${i}">${i+1}. ${escapeHtml(item.title)} ${S.read[item.id]?'✓':''}</button>`).join('')}</div></div>
 </section>`;
}
function splitParagraphs(s){return s.split(/\n\n/).filter(Boolean)}
function mantras(){let filters=['All','Discipline','Emotions','Self-talk','Mind & food','Reset','Saved'];let entries=MANTRAS.map((m,i)=>({...m,id:i})).filter(m=>S.mantraFilter==='All'||(S.mantraFilter==='Saved'?S.favoriteMantras.includes(m.id):m.category===S.mantraFilter));let date=new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);if(!S.reps||S.reps.date!==date){S.reps={date,done:[]};persist()}let chosen=[0,2,10,20,32],ticks=S.reps.done.length;return `<section class="view"><div class="eyebrow">SHORT • BELIEVABLE • ACTIONABLE</div><h1 class="h1">The mantra room</h1><p class="intro">Original reminder statements inspired by the books. Use them to pause and reconnect with your next action, not to force uncomfortable feelings away.</p><div class="card" style="margin:18px 0 23px"><div class="row"><strong style="font:22px Georgia,serif">Daily 5 × 3</strong><span class="pill" id="repScore">${ticks} / 15</span></div><p class="small">Repeat each of five mantras three times. Tap each circle as you finish. Your count resets each new day.</p><div class="meter" style="margin:12px 0 17px"><b id="repMeter" style="width:${Math.round(ticks/15*100)}%"></b></div>${chosen.map((id)=>`<div style="padding:11px 0;border-bottom:1px solid var(--hair)"><div style="font:16px/1.45 Georgia,serif;margin-bottom:10px">${escapeHtml(MANTRAS[id].text)}</div><div class="control-row">${[1,2,3].map(r=>{let key=id+'-'+r,on=S.reps.done.includes(key);return `<button class="iconbtn ${on?'active':''}" data-act="rep" data-id="${key}" aria-label="Repetition ${r} for mantra">${on?'✓':r}</button>`}).join('')}</div></div>`).join('')}</div><h2 class="section-title">Mantra collection</h2><div class="tabs" role="group" aria-label="Mantra categories">${filters.map(f=>`<button data-act="filter" data-id="${escapeHtml(f)}" class="${f===S.mantraFilter?'sel':''}">${escapeHtml(f)}</button>`).join('')}</div>${entries.length?entries.map(m=>`<div class="mantra"><div class="row"><span class="eyebrow" style="letter-spacing:1px">${escapeHtml(m.category)}</span><button class="iconbtn ${S.favoriteMantras.includes(m.id)?'active':''}" data-act="favorite" data-index="${m.id}" aria-label="Favorite">${S.favoriteMantras.includes(m.id)?'♥':'♡'}</button></div><div class="words">${escapeHtml(m.text)}</div><button class="btn secondary tiny" data-act="copy" data-index="${m.id}">Copy mantra</button></div>`).join(''):'<div class="notice">No saved mantras yet. Tap ♡ to keep your favorites.</div>'}</section>`}
function practice(){let d=S.draft,checklist=[['plan','I wrote the setup, entry, exit and stop-loss before trading.'],['risk','I kept size and maximum daily loss within my limits.'],['patience','I did not chase or force a trade out of boredom.'],['pause','I paused or stopped when negative emotions escalated.'],['review','I reviewed my behavior without personal insults.']];let checked=checklist.filter(([key])=>d[key]).length;return `<section class="view"><div class="eyebrow">PROCESS BEFORE P&L</div><h1 class="h1">Discipline lab</h1><p class="intro">A 30-session reset built for rule adherence. Use demo or replay while training your habits. No broker connection; no trading orders.</p><div class="stats-grid" style="margin:18px 0"><div class="metric"><b>${S.sessions.length}</b><span>Sessions logged</span></div><div class="metric"><b>${S.sessions.length?Math.round(S.sessions.reduce((sum,x)=>sum+x.score,0)/S.sessions.length):0}%</b><span>Avg. compliance</span></div><div class="metric"><b>${S.sessions.filter(x=>x.score===100).length}</b><span>Perfect sessions</span></div></div><div class="card"><div class="row"><h2 style="font:23px Georgia,serif;margin:0">Today's commitment</h2><span class="pill">${checked}/5 RULES</span></div><p class="small">Check only what you genuinely followed at the end of the session.</p>${checklist.map(([k,t])=>`<label class="habit"><input type="checkbox" data-field="${k}" ${d[k]?'checked':''}/><span>${escapeHtml(t)}</span></label>`).join('')}<div class="meter" style="margin-top:16px"><b style="width:${checked*20}%"></b></div><div class="editor-row"><label for="emotion">Strongest emotional trigger</label><select class="input" id="emotion" data-field="emotion"><option value="none">No significant emotional trigger</option>${['FOMO','Revenge','Fear of loss','Anger','Boredom','Negative self-talk','Overconfidence'].map(x=>`<option value="${x}" ${d.emotion===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="editor-row"><label for="incident">What happened? What will I do differently?</label><textarea class="input" id="incident" data-field="incident" placeholder="Example: I chased a candle after missing my entry. Next session, I will wait for a new complete setup.">${escapeHtml(d.incident||'')}</textarea></div><button class="btn" data-act="saveSession">Save today's session · ${checked*20}%</button></div><h2 class="section-title">90-second reset</h2><div class="card"><p class="intro" style="margin-top:0">When you feel compelled to recover losses, pause orders and observe the urge. This countdown is a reflection aid, not a trading lock.</p><div style="font:44px Georgia,serif;text-align:center;margin:14px 0" id="timerDisplay">01:30</div><div class="row"><button class="btn" data-act="startTimer">Start reset</button><button class="btn secondary" data-act="cancelTimer">Clear</button></div></div><h2 class="section-title">Knowledge check</h2><div class="card row"><div><strong>10 questions</strong><p class="small" style="margin:4px 0">Test real concepts from the study collection.</p></div><button class="btn tiny" data-act="nav" data-id="quiz">Start →</button></div></section>`}
function setupTimer(){clearInterval(timerHandle);let label=$('timerDisplay');if(!label)return;let update=()=>{let sec=S.timerEnd?Math.max(0,Math.ceil((S.timerEnd-Date.now())/1000)):90;label.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;if(!sec&&S.timerEnd){S.timerEnd=0;clearInterval(timerHandle);notify('Reset complete. Decide from your written plan.')}};update();timerHandle=setInterval(update,300)}
function stats(){let sessions=S.sessions.slice().reverse().slice(0,8).reverse();let max=BOOKS.reduce((n,b)=>n+b.chapters.length,0);return `<section class="view"><div class="eyebrow">BEHAVIOR OVER OUTCOME</div><h1 class="h1">Your progress</h1><p class="intro">Measure what you can control: completing lessons, documenting mistakes and following your rules.</p><div class="stats-grid" style="margin:22px 0"><div class="metric"><b>${totalRead()}</b><span>Chapters read</span></div><div class="metric"><b>${S.bookmarks.length}</b><span>Bookmarks</span></div><div class="metric"><b>${S.sessions.length}</b><span>Practice logs</span></div></div><div class="card"><div class="row"><strong>Reading completion</strong><span class="small">${totalRead()} of ${max}</span></div><div class="meter" style="margin:15px 0"><b style="width:${Math.round(totalRead()/max*100)}%"></b></div>${BOOKS.map(b=>`<div class="row" style="font-size:12px;margin-top:13px"><span>${escapeHtml(b.title)}</span><span>${readPct(b)}%</span></div><div class="progress" style="margin-top:6px"><i style="width:${readPct(b)}%"></i></div>`).join('')}</div><h2 class="section-title">Recent discipline scores</h2><div class="card"><p class="small" style="margin:0">Each bar represents the five behavior commitments checked in a session.</p>${sessions.length?`<div class="stat-chart">${sessions.map((x,i)=>`<div class="bar" style="height:${Math.max(5,x.score)}%"><span>${x.score}%</span></div>`).join('')}</div><div class="small" style="text-align:center;margin-top:30px">Oldest → latest</div>`:'<p class="notice">No sessions yet. Log a session in Discipline Lab to see your trend.</p>'}</div><h2 class="section-title">Bookmarked chapters</h2><div class="chapter-list">${S.bookmarks.length?S.bookmarks.map(id=>{let b=BOOKS.find(b=>b.chapters.some(c=>c.id===id)),i=b.chapters.findIndex(c=>c.id===id);return `<button class="chapter-row" data-act="bookmarkOpen" data-id="${b.id}" data-index="${i}"><span>♧</span><span style="flex:1"><strong>${escapeHtml(b.chapters[i].title)}</strong><small>${escapeHtml(b.title)}</small></span>›</button>`}).join(''):'<div class="notice">Bookmark any chapter from the reader to find it here.</div>'}</div><h2 class="section-title">Your data</h2><div class="card"><p class="small">All reading and practice data is stored locally on this device. Export it for your records, or import a previous backup.</p><div class="control-row"><button class="btn secondary tiny" data-act="export">Export backup</button><button class="btn secondary tiny" data-act="import">Import backup</button><input type="file" id="importFile" accept="application/json,.json" style="display:none" /></div></div></section>`}
function quiz(){let i=S.quizIndex,q=DATA.quiz[i],done=S.quizAnswer!==null;return `<section class="view reader"><button class="btn secondary tiny" data-act="nav" data-id="practice">← Practice</button><div class="eyebrow" style="margin:25px 0 10px">QUESTION ${i+1} OF ${DATA.quiz.length}</div><div class="meter"><b style="width:${(i+1)/DATA.quiz.length*100}%"></b></div><h1 class="h1" style="font-size:30px;margin-top:22px">${escapeHtml(q.q)}</h1><div class="card">${q.o.map((o,k)=>`<button class="quiz-choice ${done&&k===q.a?'right':''} ${done&&k===S.quizAnswer&&k!==q.a?'wrong':''}" data-act="answer" data-index="${k}" ${done?'disabled':''}>${['A','B','C'][k]}. ${escapeHtml(o)}</button>`).join('')}${done?`<div class="notice"><b>${S.quizAnswer===q.a?'Correct!':'Review the concept.'}</b> ${escapeHtml(q.why)}</div>`:''}<button class="btn" style="margin-top:20px" data-act="nextQ" ${done?'':'disabled'}>${i===DATA.quiz.length-1?'Finish quiz':'Next question →'}</button></div></section>`}
function search(){let q=String(S.search||'').trim().toLowerCase();let matches=[];if(q.length>1){BOOKS.forEach(b=>b.chapters.forEach((c,i)=>{let hay=(c.title+' '+c.key+' '+c.deep+' '+c.example+' '+c.practice+' '+(c.quick?.plain||'')+' '+(c.quick?.pattern||'')+' '+(c.source_example?.text||'')).toLowerCase();if(hay.includes(q))matches.push({b,c,i})}))}return `<section class="view"><h1 class="h1">Find a concept</h1><input class="input" id="searchInput" placeholder="Try fear, patience, protein, self-talk…" value="${escapeHtml(S.search||'')}" autocomplete="off" aria-label="Search chapters"/><div class="small" style="margin:14px 0">${q.length>1?matches.length+' matching chapters':'Type at least 2 letters to search the guides'}</div><div id="searchResults" class="chapter-list">${matches.map(({b,c,i})=>`<button class="chapter-row" data-act="bookmarkOpen" data-id="${b.id}" data-index="${i}"><span>⌕</span><span style="flex:1"><strong>${escapeHtml(c.title)}</strong><small>${escapeHtml(b.title)}</small></span>›</button>`).join('')}</div></section>`}
function handle(act,el){let id=el.dataset.id,idx=Number(el.dataset.index||0);switch(act){case'nav':if(id==='reader'&&view!=='reader')view='reader',render(),window.scrollTo(0,0);else switchView(id);break;case'outline':openOutline(id);break;case'open':openBook(id);break;case'gochapter':chapterIndex(idx);break;case'bookmarkOpen':S.book=id;chapterIndex(idx);break;case'prev':chapterIndex(S.chapter-1);break;case'next':chapterIndex(S.chapter+1);break;case'bookmark':{let c=getBook().chapters[S.chapter].id;S.bookmarks=S.bookmarks.includes(c)?S.bookmarks.filter(x=>x!==c):[...S.bookmarks,c];persist();render();notify(S.bookmarks.includes(c)?'Bookmark saved':'Bookmark removed');break}case'mark':{let c=getBook().chapters[S.chapter].id;S.read[c]=!S.read[c];persist();render();notify(S.read[c]?'Chapter completed':'Marked unread');break}case'font':$('settingsPanel').hidden=false;break;case'toggleOutline':$('drawer').classList.toggle('show');break;case'filter':S.mantraFilter=id;persist();render();break;case'rep':{S.reps.done=S.reps.done.includes(id)?S.reps.done.filter(x=>x!==id):[...S.reps.done,id];persist();el.classList.toggle('active',S.reps.done.includes(id));el.textContent=S.reps.done.includes(id)?'✓':id.split('-')[1];$('repScore').textContent=S.reps.done.length+' / 15';$('repMeter').style.width=Math.round(S.reps.done.length/15*100)+'%';if(S.reps.done.length===15)notify('All 15 repetitions completed today');break;}case'favorite':S.favoriteMantras=S.favoriteMantras.includes(idx)?S.favoriteMantras.filter(x=>x!==idx):[...S.favoriteMantras,idx];persist();render();break;case'copy':{let t=MANTRAS[idx].text;const copy=()=>{let ta=document.createElement('textarea');ta.value=t;document.body.append(ta);ta.select();document.execCommand('copy');ta.remove();notify('Mantra copied')};if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).then(()=>notify('Mantra copied')).catch(copy)}else copy();break}case'saveSession':{let today=new Date().toISOString().slice(0,10);let score=['plan','risk','patience','pause','review'].filter(x=>S.draft[x]).length*20;S.sessions.push({id:Date.now(),day:today,score,emotion:S.draft.emotion||'none',incident:String(S.draft.incident||'').slice(0,3000)});S.draft={};persist();render();notify('Session saved at '+score+'% compliance');break}case'startTimer':S.timerEnd=Date.now()+90000;setupTimer();break;case'cancelTimer':S.timerEnd=0;setupTimer();break;case'answer':S.quizAnswer=idx;persist();render();break;case'nextQ':if(S.quizIndex<DATA.quiz.length-1)S.quizIndex++;else{S.quizIndex=0;switchView('practice');notify('Quiz completed');break}S.quizAnswer=null;persist();render();break;case'export':{if(window.RKNative){window.RKNative.exportBackup(JSON.stringify({app:'Mindful Reader by RK',version:1,data:S}));notify('Choose where to save backup');break;}let blob=new Blob([JSON.stringify({app:'Mindful Reader by RK',version:1,data:S},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mindful-reader-backup.json';document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);notify('Backup prepared');break}case'import':if(window.RKNative){window.RKNative.importBackup();break;} $('importFile').click();break}}

$('main').addEventListener('change',e=>{let t=e.target;if(t.dataset.field){let value=t.type==='checkbox'?t.checked:t.value;S.draft[t.dataset.field]=value;persist();if(t.type==='checkbox'){let sc=t.closest('.card').querySelector('.pill');if(sc){let n=['plan','risk','patience','pause','review'].filter(k=>S.draft[k]).length;sc.textContent=n+'/5 RULES';t.closest('.card').querySelector('.meter b').style.width=n*20+'%';t.closest('.card').querySelector('[data-act=saveSession]').textContent=`Save today's session · ${n*20}%`}}}if(t.id==='importFile'&&t.files[0]){let f=t.files[0];if(f.size>2000000)return notify('Backup file is too large');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(d.app!=='Mindful Reader by RK'||!d.data||!Array.isArray(d.data.sessions))throw Error('Invalid');Object.assign(S,d.data);persist();render();notify('Backup restored')}catch{notify('Invalid backup file')}};r.readAsText(f)}});
$('main').addEventListener('input',e=>{let t=e.target;if(t.id==='searchInput'){let pos=t.selectionStart;S.search=t.value;let content=search();let tmp=document.createElement('div');tmp.innerHTML=content;$('searchResults').innerHTML=tmp.querySelector('#searchResults').innerHTML;$('searchResults').previousElementSibling.textContent=tmp.querySelector('#searchResults').previousElementSibling.textContent;t.focus();t.setSelectionRange(pos,pos)}else if(t.dataset.field){S.draft[t.dataset.field]=t.value;persist()}});
$('searchButton').addEventListener('click',()=>switchView('search'));$('settingsButton').addEventListener('click',()=>{$('settingsPanel').hidden=!$('settingsPanel').hidden});$('closeSettings').addEventListener('click',()=>{$('settingsPanel').hidden=true});document.querySelectorAll('[data-theme-set]').forEach(b=>b.addEventListener('click',()=>{S.theme=b.dataset.themeSet;persist();render();$('settingsPanel').hidden=false}));$('fontLess').addEventListener('click',()=>{S.font=Math.max(15,S.font-1);persist();render();$('settingsPanel').hidden=false});$('fontMore').addEventListener('click',()=>{S.font=Math.min(27,S.font+1);persist();render();$('settingsPanel').hidden=false});$('fontLabel').textContent=S.font+' px';
window.receiveNativeBackup=(raw)=>{try{let d=JSON.parse(raw);if(d.app!=='Mindful Reader by RK'||!d.data||!Array.isArray(d.data.sessions))throw Error('Invalid');Object.assign(S,d.data);persist();render();notify('Backup restored')}catch{notify('Invalid backup file')}};window.readerBack=()=>{if(view==='reader')switchView('outline');else if(view!=='library')switchView('library');else return false;return true};render();
})();
</script></body></html>
